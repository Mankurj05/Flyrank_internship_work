<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Settings - Premium Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --error-color: #f87171;
            --success-color: #34d399;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .settings-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .settings-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(99, 102, 241, 0.15);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 24px;
            text-align: center;
            background: linear-gradient(to right, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 5px;
            min-height: 18px;
            display: block;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .checkbox-group input {
            margin-right: 10px;
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
        }

        .checkbox-group label {
            margin-bottom: 0;
            font-size: 14px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        #feedbackMessage {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        #feedbackMessage.success {
            background: rgba(52, 211, 153, 0.15);
            color: var(--success-color);
            border: 1px solid rgba(52, 211, 153, 0.3);
            display: block;
        }
        
        #feedbackMessage.error {
            background: rgba(248, 113, 113, 0.15);
            color: var(--error-color);
            border: 1px solid rgba(248, 113, 113, 0.3);
            display: block;
        }
    </style>
</head>
<body>
    <main class="settings-card" role="main">
        <h1>Account Settings</h1>
        <form id="settingsForm" novalidate>
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    aria-describedby="usernameError" 
                    aria-required="true"
                    autocomplete="username"
                >
                <span id="usernameError" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    aria-describedby="emailError" 
                    aria-required="true"
                    autocomplete="email"
                >
                <span id="emailError" class="error-message" role="alert"></span>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    aria-describedby="passwordError" 
                    aria-required="true"
                    autocomplete="new-password"
                >
                <span id="passwordError" class="error-message" role="alert"></span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="notifications" name="notifications">
                <label for="notifications">Enable email updates and notifications</label>
            </div>

            <button type="submit">Save Changes</button>
            <div id="feedbackMessage" role="alert"></div>
        </form>
    </main>
    <script src="validation.js"></script>
    <script src="app.js"></script>
</body>
</html>
